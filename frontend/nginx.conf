server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
 
    # Le navigateur appelle /api/... ; nginx relaie vers le service "backend"
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
    }
 
    # Routage Angular
    location / {
        try_files $uri $uri/ /index.html;
    }
}
 
