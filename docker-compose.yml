version: "3.9"

services:

  mysql-db:
    image: mysql:8
    container_name: mysql-db

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: devops_db
      MYSQL_USER: devops
      MYSQL_PASSWORD: devops123

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - devops-network

  backend:
    build: ./backend
    container_name: backend

    depends_on:
      - mysql-db

    ports:
      - "8090:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/devops_db
      SPRING_DATASOURCE_USERNAME: devops
      SPRING_DATASOURCE_PASSWORD: devops123

    networks:
      - devops-network

  frontend:
    build: ./frontend
    container_name: frontend

    depends_on:
      - backend

    ports:
      - "4200:80"

    networks:
      - devops-network

volumes:
  mysql_data:

networks:
  devops-network:
